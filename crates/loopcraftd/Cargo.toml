[package]
name = "loopcraftd"
description = "LoopCraft daemon: applies config.yaml to the plug-in and routes audio"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
arc-swap = "1"
lc-sys = { path = "../lc-sys" }
lc-ca = { path = "../lc-ca" }
